services:
  invoices:
    build:
      context: ../..
      dockerfile: deploy/invoices/Dockerfile
    image: kaptan-invoices:local
    init: true
    restart: unless-stopped
    env_file:
      - ${KAPTAN_WORKER_ENV:?Set KAPTAN_WORKER_ENV to the absolute private worker env file path}
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
